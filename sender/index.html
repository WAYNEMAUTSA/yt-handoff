<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Send to Desktop</title>
<link rel="manifest" href="./manifest.json" />
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<style>
  body { font-family: -apple-system, Roboto, Arial, sans-serif; background:#0f0f0f; color:#f1f1f1; margin:0; padding:24px; }
  h1 { font-size:18px; }
  label { display:block; margin-top:14px; font-size:13px; color:#ccc; }
  input { width:100%; padding:10px; margin-top:4px; border-radius:8px; border:1px solid #333; background:#1c1c1c; color:white; box-sizing:border-box; font-size:14px; }
  button { padding:12px 16px; margin-top:16px; border:none; border-radius:8px; background:#ff0033; color:white; font-weight:600; cursor:pointer; font-size:14px; width:100%; }
  button.secondary { background:#333; }
  #status { margin-top:20px; font-size:15px; text-align:center; padding:16px; border-radius:10px; background:#1c1c1c; }
  a.edit { display:block; text-align:center; margin-top:20px; color:#888; font-size:12px; }
</style>
</head>
<body>
<div id="app">Loading...</div>

<script>
const CONFIG_KEY = "ytcontinue_config";

function getConfig() {
  try { return JSON.parse(localStorage.getItem(CONFIG_KEY) || "null"); }
  catch { return null; }
}
function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

function extractYoutubeInfo(text) {
  const match = text.match(/https?:\/\/(?:www\.)?(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/))[^\s]+/);
  if (!match) return null;
  const url = new URL(match[0]);

  let videoId = null;
  if (url.hostname.includes("youtu.be")) {
    videoId = url.pathname.slice(1).split("/")[0];
  } else if (url.pathname.includes("/shorts/")) {
    videoId = url.pathname.split("/shorts/")[1];
  } else {
    videoId = url.searchParams.get("v");
  }
  if (!videoId) return null;

  const list = url.searchParams.get("list") || null;
  const indexParam = url.searchParams.get("index");
  const index = indexParam ? Math.max(0, parseInt(indexParam, 10) - 1) : null;

  let t = url.searchParams.get("t");
  if (t) t = parseInt(t.replace("s", ""), 10);

  return { videoId, list, index, t: t || null };
}

async function fetchTitle(videoId) {
  try {
    const res = await fetch(`https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`);
    if (!res.ok) throw new Error("no oembed");
    const data = await res.json();
    return data.title || "Shared video";
  } catch {
    return "Shared video";
  }
}

function entryUrl(config) {
  return `${config.databaseURL.replace(/\/+$/, "")}/nowplaying/${config.secret}.json`;
}

async function handleShare(config, info) {
  const app = document.getElementById("app");
  app.innerHTML = `<div id="status">Sending...</div>`;

  const title = await fetchTitle(info.videoId);
  const entry = { ...info, title, ts: Date.now() };

  try {
    const res = await fetch(entryUrl(config), {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(entry),
    });
    if (!res.ok) throw new Error("write failed");
    document.getElementById("status").textContent = "Sent! ✅ Closing...";
    setTimeout(() => window.close(), 800);
  } catch (e) {
    document.getElementById("status").textContent =
      "\u274C Could not reach your desktop's database. Check your phone has internet and that the settings were entered correctly (try re-scanning the QR code).";
  }
}

function renderSettings(existing) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>Send to Desktop \u2014 Setup</h1>
    <button id="scanBtn">\ud83d\udcf7 Scan QR code from desktop</button>
    <video id="preview" style="width:100%;border-radius:8px;margin-top:10px;display:none;"></video>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="switchCamBtn" class="secondary" style="display:none;">\ud83d\udd04 Switch camera</button>
    <div style="text-align:center;margin:12px 0;color:#666;font-size:12px;">or enter manually</div>
    <label>Firebase Realtime Database URL</label>
    <input id="dbUrl" value="${existing ? existing.databaseURL : ""}" placeholder="https://your-project-default-rtdb.firebaseio.com" />
    <label>Secret room code (same one as your extension)</label>
    <input id="secret" value="${existing ? existing.secret : ""}" />
    <label>Expiry hours</label>
    <input id="expiryHours" type="number" value="${existing ? existing.expiryHours : 6}" />
    <button id="saveBtn">Save</button>
  `;

  document.getElementById("saveBtn").addEventListener("click", () => {
    const cfg = {
      databaseURL: document.getElementById("dbUrl").value.trim(),
      secret: document.getElementById("secret").value.trim(),
      expiryHours: parseFloat(document.getElementById("expiryHours").value) || 6,
    };
    if (!cfg.databaseURL.includes("firebaseio.com")) {
      alert("That doesn't look like a Realtime Database URL. Check it ends in firebaseio.com.");
      return;
    }
    saveConfig(cfg);
    boot();
  });

  document.getElementById("scanBtn").addEventListener("click", startScan);
  document.getElementById("switchCamBtn").addEventListener("click", switchCamera);
}

let allBackCameras = [];
let currentCameraIndex = 0;
let activeStream = null;

async function getBackCameraList() {
  const tempStream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
  });
  tempStream.getTracks().forEach((t) => t.stop());

  const devices = await navigator.mediaDevices.enumerateDevices();
  const videoInputs = devices.filter((d) => d.kind === "videoinput");
  return videoInputs.filter((d) => !/front|user/i.test(d.label));
}

async function startScan() {
  const video = document.getElementById("preview");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  video.style.display = "block";

  allBackCameras = await getBackCameraList();

  const savedDeviceId = localStorage.getItem("preferredCameraId");
  currentCameraIndex = allBackCameras.findIndex((d) => d.deviceId === savedDeviceId);
  if (currentCameraIndex === -1) currentCameraIndex = 0;

  document.getElementById("switchCamBtn").style.display =
    allBackCameras.length > 1 ? "block" : "none";

  await openCamera();

  function tick() {
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height);
      if (code) {
        if (activeStream) activeStream.getTracks().forEach((t) => t.stop());
        try {
          const cfg = JSON.parse(code.data);
          if (cfg.databaseURL && cfg.secret) {
            saveConfig(cfg);
            boot();
            return;
          }
        } catch (e) {
          alert("That QR code didn't contain valid settings.");
        }
        return;
      }
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

async function openCamera() {
  const video = document.getElementById("preview");
  if (activeStream) activeStream.getTracks().forEach((t) => t.stop());

  const camera = allBackCameras[currentCameraIndex];
  const constraints = camera
    ? { video: { deviceId: { exact: camera.deviceId } } }
    : { video: { facingMode: "environment" } };

  try {
    activeStream = await navigator.mediaDevices.getUserMedia(constraints);
  } catch (e) {
    alert("Could not access the camera: " + e.message);
    return;
  }
  video.srcObject = activeStream;
  video.setAttribute("playsinline", true);
  await video.play();

  if (camera) localStorage.setItem("preferredCameraId", camera.deviceId);
}

function switchCamera() {
  if (allBackCameras.length < 2) return;
  currentCameraIndex = (currentCameraIndex + 1) % allBackCameras.length;
  openCamera();
}

function renderHome(config) {
  const app = document.getElementById("app");
  app.innerHTML = `
    <h1>Send to Desktop</h1>
    <div id="status">Ready. Share a YouTube video to this app from the Share menu.</div>
    <a class="edit" href="#" id="editLink">Edit settings</a>
  `;
  document.getElementById("editLink").addEventListener("click", (e) => {
    e.preventDefault();
    renderSettings(config);
  });
}

function boot() {
  const config = getConfig();
  const params = new URLSearchParams(window.location.search);
  const sharedText = params.get("text") || params.get("url") || params.get("title") || "";

  if (!config || !config.databaseURL || !config.secret) {
    renderSettings(config);
    return;
  }

  if (sharedText) {
    const info = extractYoutubeInfo(sharedText);
    if (info) {
      handleShare(config, info);
    } else {
      document.getElementById("app").innerHTML =
        `<div id="status">That didn't look like a YouTube link.</div>`;
    }
  } else {
    renderHome(config);
  }
}

boot();
</script>
</body>
</html>
