<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
body { width: 280px; font-family: Segoe UI, Arial, sans-serif; padding: 14px; background:#0f0f0f; color:#f1f1f1; }
h1 { font-size:14px; margin:0 0 10px; }
.card { background:#1c1c1c; border-radius:8px; padding:12px; margin-bottom:10px; }
.title { font-size:13px; font-weight:600; margin-bottom:4px; }
.meta { font-size:11px; color:#aaa; }
.empty { font-size:12px; color:#aaa; text-align:center; padding:10px 0; }
button { width:100%; padding:8px; border:none; border-radius:6px; background:#ff0033; color:white; font-weight:600; cursor:pointer; margin-top:6px; }
button.secondary { background:#333; }
a.settings { display:block; text-align:center; font-size:11px; color:#888; margin-top:10px; text-decoration:none; }
</style>
</head>
<body>
<h1>Continue Watching</h1>
<div id="content"></div>
<button id="refresh" class="secondary">Check now</button>
<a class="settings" href="#" id="open-options">Settings</a>
<script src="common.js"></script>
<script src="popup.js"></script>
</body>
</html>
