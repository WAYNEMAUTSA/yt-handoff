<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
body { font-family: Segoe UI, Arial, sans-serif; max-width:420px; margin:30px auto; background:#0f0f0f; color:#f1f1f1; }
label { display:block; margin-top:14px; font-size:13px; color:#ccc; }
input { width:100%; padding:8px; margin-top:4px; border-radius:6px; border:1px solid #333; background:#1c1c1c; color:white; box-sizing:border-box; }
button { padding:8px 14px; margin-top:14px; margin-right:8px; border:none; border-radius:6px; background:#ff0033; color:white; font-weight:600; cursor:pointer; }
button.secondary { background:#333; }
#status { margin-top:12px; font-size:13px; }
#qrcode { margin-top:16px; padding:16px; background:white; display:inline-block; border-radius:8px; }
.hint { font-size:12px; color:#888; margin-top:6px; }
</style>
</head>
<body>
<h2>YouTube Continue Watching &mdash; Settings</h2>

<label>Firebase Realtime Database URL</label>
<input id="databaseUrl" placeholder="https://your-project-default-rtdb.firebaseio.com" />

<label>Secret room code (keep this private)</label>
<input id="secret" placeholder="e.g. a random string" />
<button class="secondary" id="generate">Generate random</button>

<label>Expire entries after (hours)</label>
<input id="expiryHours" type="number" min="1" value="6" />

<div>
<button id="save">Save</button>
<button class="secondary" id="test">Test connection</button>
</div>

<div id="status"></div>

<div>
<div id="qrcode"></div>
<div class="hint">Scan this on your phone's setup screen to pair instantly \u2014 no typing.</div>
</div>

<script src="qrcode.min.js"></script>
<script src="common.js"></script>
<script src="options.js"></script>
</body>
</html>
